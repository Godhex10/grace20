<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grace · Setup</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 40px 18px;
    background: radial-gradient(1200px 600px at 50% -10%, #14181f, #05070a 60%);
    color: #e6edf3; font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex; justify-content: center; align-items: flex-start;
  }
  .card {
    width: min(620px, 100%); background: linear-gradient(135deg, rgba(22,24,28,0.96), rgba(10,11,14,0.96));
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 28px 30px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.7);
  }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: 1px; }
  h1 .g { color: #5ab4ff; }
  .sub { margin: 0 0 22px; color: rgba(230,237,243,0.55); font-size: 13px; line-height: 1.5; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 12px; margin-bottom: 5px; color: rgba(230,237,243,0.8); }
  label .req { color: #ff8a5a; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 7px; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.14); color: #e6edf3; font-size: 13px; outline: none;
    font-family: 'Consolas', monospace;
  }
  input:focus { border-color: rgba(90,180,255,0.6); box-shadow: 0 0 0 1px rgba(90,180,255,0.2); }
  input::placeholder { color: rgba(230,237,243,0.28); }
  .row { display: flex; gap: 14px; align-items: center; margin-top: 22px; }
  button {
    padding: 11px 22px; border-radius: 8px; border: 1px solid rgba(90,180,255,0.5);
    background: rgba(90,180,255,0.18); color: #cfe8ff; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .15s;
  }
  button:hover { background: rgba(90,180,255,0.32); border-color: rgba(90,180,255,0.85); }
  button:disabled { opacity: .5; cursor: default; }
  .note { flex: 1; font-size: 12px; color: rgba(230,237,243,0.5); }
  .ok { color: #6ee7a8; }
  .err { color: #ff7a7a; }
  .hint { font-size: 11px; color: rgba(230,237,243,0.4); margin-top: 3px; }
  details { margin-top: 8px; }
  summary { cursor: pointer; font-size: 12px; color: rgba(90,180,255,0.85); user-select: none; }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="g">G.R.A.C.E.</span> — first-run setup</h1>
    <p class="sub">Enter your keys once. They're saved privately on this PC (in your
      AppData) and never stored inside the app. Only the Gemini key is required —
      add a Supabase URL to share your data across machines.</p>

    <div id="required-fields"></div>
    <details>
      <summary>Optional keys (voice, search, maps, email…)</summary>
      <div id="optional-fields" style="margin-top:12px;"></div>
    </details>

    <div class="row">
      <button id="save-btn" onclick="saveSetup()">Save &amp; continue</button>
      <div class="note" id="note"></div>
    </div>
  </div>

<script>
const API = '';
let FIELDS = [];

async function loadStatus() {
  try {
    const r = await fetch(API + '/api/setup/status');
    const d = await r.json();
    FIELDS = d.fields || [];
    render();
  } catch (e) {
    document.getElementById('note').innerHTML = '<span class="err">Could not reach the backend.</span>';
  }
}

function fieldHtml(f) {
  const req = f.required ? ' <span class="req">*</span>' : '';
  const ph = f.has_value ? ('saved: ' + f.masked) : '';
  return `<div class="field">
    <label>${f.label}${req}</label>
    <input id="f_${f.key}" placeholder="${ph || f.key}" autocomplete="off" spellcheck="false">
  </div>`;
}

function render() {
  document.getElementById('required-fields').innerHTML =
    FIELDS.filter(f => f.required).map(fieldHtml).join('');
  document.getElementById('optional-fields').innerHTML =
    FIELDS.filter(f => !f.required).map(fieldHtml).join('');
}

async function saveSetup() {
  const btn = document.getElementById('save-btn');
  const note = document.getElementById('note');
  const values = {};
  FIELDS.forEach(f => {
    const v = (document.getElementById('f_' + f.key).value || '').trim();
    if (v) values[f.key] = v;
  });
  btn.disabled = true; note.textContent = 'Saving…';
  try {
    const r = await fetch(API + '/api/setup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values })
    });
    const d = await r.json();
    if (d.ok) {
      note.innerHTML = '<span class="ok">Saved ✓ — close Grace and reopen it to finish.</span>';
    } else {
      note.innerHTML = '<span class="err">' + (d.error || 'Save failed.') + '</span>';
      btn.disabled = false;
    }
  } catch (e) {
    note.innerHTML = '<span class="err">Save failed — network error.</span>';
    btn.disabled = false;
  }
}

loadStatus();
</script>
</body>
</html>
